<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>flexIA Publisher — Formalism IDE</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#151b23;
    --panel2:#0f151c;
    --border:#26303c;
    --text:#c9d1d9;
    --dim:#6b7684;
    --accent:#7ee787;
    --accent2:#79c0ff;
    --kw:#ff7b9c;
    --type:#79c0ff;
    --fn:#d2a8ff;
    --num:#ffab70;
    --str:#a5d6ff;
    --com:#6b7684;

    --cpp:#5aa7ff;
    --py:#f3c34a;
    --st:#7ee787;
    --sim:#ff9f43;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#14161d;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .ide-window{
    width:100%; height:100%;
    display:flex; flex-direction:column;
    background:#14161d;
    border:0;
    border-radius:0;
    overflow:hidden;
    animation: fadeUp .9s ease .15s both;
  }

  .titlebar{
    display:flex; align-items:center; gap:10px;
    flex-shrink:0;
    padding:10px 14px;
    background:var(--panel2);
    border-bottom:1px solid var(--border);
  }
  .dots{ display:flex; gap:6px; }
  .dots span{ width:10px; height:10px; border-radius:50%; background:#2a333d; }
  .wintitle{
    flex:1; text-align:center; font-size:.72rem; color:var(--dim);
    letter-spacing:.3px;
  }
  .led-indicator{
    display:flex; align-items:center; gap:6px;
    font-size:.68rem; color:var(--dim); letter-spacing:.5px;
  }
  .led{
    width:9px; height:9px; border-radius:50%;
    background:#1c3323;
    animation: pubPulse .5s steps(1,end) infinite;
  }
  @keyframes pubPulse{
    0%, 12%   { background:var(--accent); box-shadow:0 0 10px 3px rgba(126,231,135,.8); }
    13%,100%  { background:#1c3323; box-shadow:0 0 0 rgba(126,231,135,0); }
  }

  .tabbar{
    display:flex; background:var(--panel2);
    flex-shrink:0;
    border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  .tab{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px;
    font-size:.76rem; color:var(--dim);
    border-right:1px solid var(--border);
    white-space:nowrap;
    position:relative;
    transition: color .3s ease, background .3s ease;
  }
  .tab .dot{ width:7px; height:7px; border-radius:50%; }
  .tab .dot.cpp{ background:var(--cpp); }
  .tab .dot.py{ background:var(--py); }
  .tab .dot.st{ background:var(--st); }
  .tab .dot.sim{ background:var(--sim); }
  .tab.active{ color:#f0f4f8; background:var(--panel); }
  .tab.active::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:linear-gradient(90deg, var(--accent2), var(--accent));
  }

  .editor{
    display:flex;
    flex:1 1 0;
    min-height:0;
    overflow-y:auto;
    background:var(--panel);
    scrollbar-width:thin;
    scrollbar-color:#2a333d transparent;
  }
  .editor::-webkit-scrollbar{ width:8px; }
  .editor::-webkit-scrollbar-thumb{ background:#2a333d; border-radius:4px; }

  .gutter{
    margin:0; padding:16px 10px; text-align:right;
    color:#3a4552; font-size:.74rem; line-height:1.65;
    user-select:none; border-right:1px solid var(--border);
    font-family:"SF Mono","Fira Code",Menlo,Consolas,monospace;
    flex-shrink:0;
    transition: opacity .28s ease;
  }
  .code-wrap{
    flex:1; overflow-x:auto;
  }
  .code{
    margin:0; padding:16px 18px;
    font-family:"SF Mono","Fira Code",Menlo,Consolas,monospace;
    font-size:.74rem; line-height:1.65; white-space:pre;
    transition: opacity .28s ease;
  }
  .sim-canvas{
    display:none;
    flex:1 1 0; min-width:0;
    align-items:center; justify-content:center;
    background:#ffffff;
    transition: opacity .28s ease;
  }
  .sim-canvas svg{ width:100%; height:100%; max-width:640px; max-height:260px; }

  .kw{ color:var(--kw); }
  .type{ color:var(--type); }
  .fn{ color:var(--fn); }
  .num{ color:var(--num); }
  .str{ color:var(--str); }
  .com{ color:var(--com); font-style:italic; }

  .statusbar{
    display:flex; align-items:center; gap:8px;
    flex-shrink:0;
    padding:7px 14px;
    background:var(--panel2);
    border-top:1px solid var(--border);
    font-size:.7rem; color:var(--dim);
  }
  .statusbar .lang-label{ color:#dbe4ee; font-weight:600; }
  .statusbar .spacer{ flex:1; }
  .cycle-indicator{ letter-spacing:3px; font-size:.6rem; }
  .cycle-indicator span{ color:#2a333d; transition:color .3s ease; }
  .cycle-indicator span.on{ color:var(--accent2); }
</style>
</head>
<body>
  <div class="ide-window">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="wintitle">FormalismIDE — Publisher</div>
      <div class="led-indicator"><span class="led"></span> PUB · 0.5s</div>
    </div>

    <div class="tabbar">
      <div class="tab active" data-lang="0"><span class="dot py"></span>publisher.py</div>
      <div class="tab" data-lang="1"><span class="dot cpp"></span>publisher.cpp</div>
      <div class="tab" data-lang="2"><span class="dot st"></span>publisher.st</div>
      <div class="tab" data-lang="3"><span class="dot sim"></span>publisher.slx</div>
    </div>

    <div class="editor">
      <pre class="gutter" id="gutterView"></pre>
      <div class="code-wrap"><pre class="code" id="codeView"></pre></div>
      <div class="sim-canvas" id="simCanvas">
        <svg viewBox="0 0 420 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="simBlockGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fcfcfc"/>
              <stop offset="1" stop-color="#a6a6a6"/>
            </linearGradient>
          </defs>

          <line x1="55" y1="100" x2="150" y2="100" stroke="#1a1a1a" stroke-width="1.4"/>
          <polygon points="150,100 140,95 140,105" fill="#1a1a1a"/>
          <text x="58" y="90" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a1a1a">In1</text>

          <rect x="150" y="66" width="120" height="68" fill="url(#simBlockGrad)"
                stroke="#1a1a1a" stroke-width="1.2" style="filter:drop-shadow(2px 3px 2px rgba(0,0,0,.22))"/>

          <line x1="270" y1="100" x2="365" y2="100" stroke="#1a1a1a" stroke-width="1.4"/>
          <polygon points="365,100 355,95 355,105" fill="#1a1a1a"/>
          <text x="318" y="90" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a1a1a">Out1</text>

          <text x="210" y="153" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1a1a1a">Publisher</text>
        </svg>
      </div>
    </div>

    <div class="statusbar">
      <span class="lang-label" id="langLabel">Python</span>
      <span id="fileLabel">· publisher.py</span>
      <span class="spacer"></span>
      <span class="cycle-indicator" id="cycleDots"><span class="on">●</span><span>●</span><span>●</span><span>●</span></span>
    </div>
  </div>

<script>
  const PY = `<span class="com"># flexIA — Publisher node  (Bert Van Acker, 2025-present)</span>

<span class="kw">class</span> <span class="fn">Publisher</span>(flexNode):
    <span class="kw">def</span> <span class="fn">__init__</span>(self, config=<span class="str">'config.yaml'</span>, verbose=<span class="kw">True</span>):
        super().__init__(config=config, verbose=verbose)
        self._name = <span class="str">"Publisher"</span>
        self.logger.info(<span class="str">"Publisher instantiated"</span>)
        self.timer = self.create_timer(timer_period=<span class="num">0.5</span>,
                        callback=self.send_data, autostart=<span class="kw">True</span>)
        self.application_status.set(value=APPLICATION_STATUS.RUNNING)

    <span class="kw">def</span> <span class="fn">send_data</span>(self):
        _dataMessage = DataMessage()
        _dataMessage.dataType = <span class="str">"Float"</span>
        _dataMessage.dataUnit = <span class="str">"m"</span>
        _dataMessage.value = round(random.uniform(<span class="num">0</span>, <span class="num">10</span>), <span class="num">3</span>)
        self.set_data(data_name=<span class="str">"CustomMessage"</span>, data=_dataMessage)
        self.logger.info(<span class="str">"Setting data"</span>)
        _dataMessage.value = round(random.uniform(<span class="num">0</span>, <span class="num">10</span>), <span class="num">3</span>)
        self.store_data(data_name=<span class="str">"TEST_DATA"</span>, data=_dataMessage)

    <span class="kw">def</span> <span class="fn">register_callbacks</span>(self):
        <span class="kw">return</span> -1

<span class="kw">def</span> <span class="fn">main</span>():
    node = Publisher(config=<span class="str">'config.yaml'</span>)
    node.register_callbacks()
    node.spin()
    node.timer.start()
    <span class="kw">while</span> <span class="kw">True</span>:
        time.sleep(<span class="num">1</span>)

<span class="kw">if</span> __name__ == <span class="str">'__main__'</span>:
    main()`;

  const CPP = `<span class="com">// flexIA — Publisher node (dummy C++ translation)</span>

<span class="kw">class</span> <span class="fn">Publisher</span> : <span class="kw">public</span> FlexNode {
<span class="kw">public</span>:
    <span class="kw">explicit</span> Publisher(<span class="kw">const</span> std::string&amp; config = <span class="str">"config.yaml"</span>)
        : FlexNode(config), name_(<span class="str">"Publisher"</span>) {
        logger.info(<span class="str">"Publisher instantiated"</span>);
        timer_ = createTimer(<span class="num">0.5</span>, [this]{ sendData(); }, <span class="kw">true</span>);
        applicationStatus.set(APPLICATION_STATUS::RUNNING);
    }

    <span class="type">void</span> <span class="fn">sendData</span>() {
        DataMessage msg;
        msg.dataType = <span class="str">"Float"</span>;
        msg.dataUnit = <span class="str">"m"</span>;
        msg.value    = randomUniform(<span class="num">0.0</span>, <span class="num">10.0</span>);
        setData(<span class="str">"CustomMessage"</span>, msg);
        logger.info(<span class="str">"Setting data"</span>);
        msg.value = randomUniform(<span class="num">0.0</span>, <span class="num">10.0</span>);
        storeData(<span class="str">"TEST_DATA"</span>, msg);
    }

    <span class="type">int</span> <span class="fn">registerCallbacks</span>() <span class="kw">override</span> { <span class="kw">return</span> -1; }

<span class="kw">private</span>:
    std::string name_;
    Timer timer_;
};

<span class="type">int</span> <span class="fn">main</span>() {
    Publisher node(<span class="str">"config.yaml"</span>);
    node.registerCallbacks();
    node.spin();
    node.timer_.start();
    <span class="kw">while</span> (<span class="kw">true</span>)
        std::this_thread::sleep_for(std::chrono::seconds(<span class="num">1</span>));
}`;

  const ST = `<span class="com">(* flexIA — Publisher node (dummy Structured Text translation) *)</span>
<span class="kw">FUNCTION_BLOCK</span> <span class="fn">Publisher</span>
<span class="kw">VAR</span>
    PubTimer    : <span class="type">TON</span>;                        <span class="com">(* 0.5 s publish tick *)</span>
    DataMessage : <span class="type">ST_DataMessage</span>;
    AppStatus   : <span class="type">E_APPLICATION_STATUS</span> := RUNNING;
<span class="kw">END_VAR</span>

<span class="com">(* re-trigger every scan the timer completes: same period as create_timer(0.5) *)</span>
PubTimer(IN := <span class="kw">NOT</span> PubTimer.Q, PT := T#<span class="num">500</span>ms);

<span class="kw">IF</span> PubTimer.Q <span class="kw">THEN</span>
    DataMessage.dataType := <span class="str">'Float'</span>;
    DataMessage.dataUnit := <span class="str">'m'</span>;
    DataMessage.value    := GenerateRandom(<span class="num">0.0</span>, <span class="num">10.0</span>);

    SetData(<span class="str">'CustomMessage'</span>, DataMessage);

    DataMessage.value    := GenerateRandom(<span class="num">0.0</span>, <span class="num">10.0</span>);
    StoreData(<span class="str">'TEST_DATA'</span>, DataMessage);
<span class="kw">END_IF</span>;

<span class="kw">END_FUNCTION_BLOCK</span>`;

  const langs = [
    { name: "Python",           file: "publisher.py",  code: PY  },
    { name: "C / C++",          file: "publisher.cpp",  code: CPP },
    { name: "Structured Text",  file: "publisher.st",   code: ST  },
    { name: "Simulink",         file: "publisher.slx",  diagram: true }
  ];

  let idx = 0;
  const tabs = document.querySelectorAll(".tab");
  const langLabel = document.getElementById("langLabel");
  const fileLabel = document.getElementById("fileLabel");
  const dots = document.querySelectorAll("#cycleDots span");
  const codeView = document.getElementById("codeView");
  const gutterView = document.getElementById("gutterView");
  const codeWrap = document.querySelector(".code-wrap");
  const simCanvas = document.getElementById("simCanvas");
  const editor = document.querySelector(".editor");

  function paint(){
    const lang = langs[idx];
    tabs.forEach(t => t.classList.toggle("active", t.dataset.lang == idx));
    dots.forEach((d,i) => d.classList.toggle("on", i === idx));
    langLabel.textContent = lang.name;
    fileLabel.textContent = "· " + lang.file;

    if (lang.diagram){
      gutterView.style.display = "none";
      codeWrap.style.display = "none";
      simCanvas.style.display = "flex";
    } else {
      simCanvas.style.display = "none";
      gutterView.style.display = "";
      codeWrap.style.display = "";
      codeView.innerHTML = lang.code;
      const lineCount = lang.code.split("\\n").length;
      let nums = "";
      for (let i = 1; i <= lineCount; i++) nums += i + (i < lineCount ? "\\n" : "");
      gutterView.textContent = nums;
    }
    editor.scrollTop = 0;
  }

  function swap(){
    codeView.style.opacity = 0;
    gutterView.style.opacity = 0;
    simCanvas.style.opacity = 0;
    setTimeout(() => {
      idx = (idx + 1) % langs.length;
      paint();
      codeView.style.opacity = 1;
      gutterView.style.opacity = 1;
      simCanvas.style.opacity = 1;
    }, 280);
  }

  paint();
  setInterval(swap, 4200);
</script>
</body>
</html>
