<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AMR × AI model — prediction only as good as the model</title>
<style>
  :root{
    --cyan:#45e0f0; --violet:#9b7bff; --green:#46d17a; --warn:#ff5f57;
    --ink:#f3f5f8; --dim:#c3cad6;
  }
  html,body{ margin:0; background:#0e1a1f; }
  .frame{
    position:relative; width:1040px; max-width:96vw; margin:28px auto;
    border:1px solid #24262f; border-radius:16px; overflow:hidden; line-height:0;
  }
  .frame img{ display:block; width:100%; height:auto; }
  .frame svg{ position:absolute; inset:0; width:100%; height:100%; }
  text{ font-family:"IBM Plex Mono", ui-monospace, monospace; }

  .scrim{ fill:rgba(9,14,22,0.66); }
  .cap-top{ fill:var(--cyan); font-size:26px; font-weight:600; letter-spacing:0.10em; }
  .cap-bot{ fill:var(--ink); font-size:30px; font-weight:600; letter-spacing:0.01em; text-anchor:middle; }
  .cap-bot .hi{ fill:var(--cyan); }
  .cap-bot .warnw{ fill:var(--warn); }

  .cloud path{ fill:url(#cGrad); filter:drop-shadow(0 0 30px rgba(155,123,255,0.45)); }
  .ai-line{ stroke:#0b1226; stroke-width:2; opacity:.4; }
  .ai-node{ fill:#0b1226; }
  .ai-name{ fill:#0b1226; font-size:40px; font-weight:800; letter-spacing:0.02em; text-anchor:middle; }
  .ai-sub{ fill:#0b1226; font-size:18px; letter-spacing:0.06em; text-anchor:middle; opacity:.75; }
  .ai-out{ fill:var(--violet); }

  .link{ fill:none; stroke-width:5; stroke-dasharray:13 12; }
  .link.up{ stroke:var(--cyan); filter:drop-shadow(0 0 6px rgba(69,224,240,0.5)); }
  .link.down{ stroke:var(--violet); filter:drop-shadow(0 0 6px rgba(155,123,255,0.5)); }
  .flow-dot.up{ fill:var(--cyan); filter:drop-shadow(0 0 9px var(--cyan)); }
  .flow-dot.down{ fill:var(--violet); filter:drop-shadow(0 0 9px var(--violet)); }
  .lbl-up{ fill:var(--cyan); font-size:22px; font-weight:600; }
  .lbl-down{ fill:var(--violet); font-size:22px; font-weight:600; }
  .lbl-amr{ fill:var(--green); font-size:22px; font-weight:700; }

  .pred{ fill:none; stroke:var(--violet); stroke-width:7; stroke-dasharray:16 14;
         filter:drop-shadow(0 0 8px rgba(155,123,255,0.55)); }
  .pred-dot{ fill:var(--violet); filter:drop-shadow(0 0 10px var(--violet)); }
  .pred-cone{ fill:var(--violet); opacity:.09; }
  .lbl-pred{ fill:var(--violet); font-size:24px; font-weight:700; letter-spacing:0.03em; }

  .dead{ fill:none; stroke:#8a94a3; stroke-width:7; stroke-dasharray:10 16; opacity:.5; }
  .gate rect{ fill:rgba(9,14,22,0.82); stroke:var(--warn); stroke-width:3; }
  .gate .g-title{ fill:var(--warn); font-size:24px; font-weight:800; letter-spacing:0.10em; }
  .gate .g-item{ fill:var(--dim); font-size:22px; }
  .gate .g-verdict{ fill:var(--warn); font-size:24px; font-weight:800; }
  .dead-tag{ fill:var(--warn); font-size:24px; font-weight:800; letter-spacing:0.06em; }

  @media (prefers-reduced-motion:no-preference){
    .link{ animation:dash 1.0s linear infinite; }
    .pred{ animation:dash 1.0s linear infinite; }
    .flow-dot{ animation:travel 2.4s linear infinite; }
    .pred-dot{ animation:travel 2.8s linear infinite; }
    .ai-node{ animation:ai 1.7s ease-in-out infinite; }
    .cloud{ animation:bob 4.6s ease-in-out infinite; transform-origin:center; }
    .dead{ animation:die 1.4s steps(1,end) infinite; }
    .gate .g-verdict{ animation:blink 1.2s steps(1,end) infinite; }
    .dead-tag{ animation:blink 1.2s steps(1,end) infinite; }
  }
  @keyframes dash{ to{ stroke-dashoffset:-25; } }
  @keyframes travel{ 0%{ offset-distance:0%; opacity:0; } 12%{ opacity:1; } 88%{ opacity:1; } 100%{ offset-distance:100%; opacity:0; } }
  @keyframes ai{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  @keyframes die{ 0%,70%{ opacity:.5; } 71%,100%{ opacity:.14; } }
  @keyframes blink{ 0%,55%{ opacity:1; } 56%,100%{ opacity:.15; } }
</style>
</head>
<body>
  <div class="frame">
    <img src="Input/AMR2.jpg" alt="AMR warehouse">
    <svg viewBox="0 0 2240 1452" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <linearGradient id="cGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="var(--cyan)"/>
          <stop offset="1" stop-color="var(--violet)"/>
        </linearGradient>
      </defs>

      <!-- top caption -->
      <rect class="scrim" x="34" y="26" width="742" height="50" rx="10"/>
      <text class="cap-top" x="52" y="61">AI MODEL IN THE LOOP &#183; PATH PREDICTION</text>

      <!-- ===== cloud = AI model in the Digital Twin (in the cloud) ===== -->
      <g class="cloud">
        <path transform="translate(470,16) scale(20)" d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>

        <!-- neural net -->
        <g transform="translate(24,30)">
          <line class="ai-line" x1="560" y1="150" x2="700" y2="120"/><line class="ai-line" x1="560" y1="150" x2="700" y2="190"/><line class="ai-line" x1="560" y1="150" x2="700" y2="260"/><line class="ai-line" x1="560" y1="150" x2="700" y2="320"/>
          <line class="ai-line" x1="560" y1="220" x2="700" y2="120"/><line class="ai-line" x1="560" y1="220" x2="700" y2="190"/><line class="ai-line" x1="560" y1="220" x2="700" y2="260"/><line class="ai-line" x1="560" y1="220" x2="700" y2="320"/>
          <line class="ai-line" x1="560" y1="290" x2="700" y2="120"/><line class="ai-line" x1="560" y1="290" x2="700" y2="190"/><line class="ai-line" x1="560" y1="290" x2="700" y2="260"/><line class="ai-line" x1="560" y1="290" x2="700" y2="320"/>
          <line class="ai-line" x1="700" y1="120" x2="840" y2="170"/><line class="ai-line" x1="700" y1="120" x2="840" y2="270"/>
          <line class="ai-line" x1="700" y1="190" x2="840" y2="170"/><line class="ai-line" x1="700" y1="190" x2="840" y2="270"/>
          <line class="ai-line" x1="700" y1="260" x2="840" y2="170"/><line class="ai-line" x1="700" y1="260" x2="840" y2="270"/>
          <line class="ai-line" x1="700" y1="320" x2="840" y2="170"/><line class="ai-line" x1="700" y1="320" x2="840" y2="270"/>
          <line class="ai-line" x1="840" y1="170" x2="935" y2="220"/><line class="ai-line" x1="840" y1="270" x2="935" y2="220"/>

          <circle class="ai-node" cx="560" cy="150" r="9" style="animation-delay:0s"/>
          <circle class="ai-node" cx="560" cy="220" r="9" style="animation-delay:.1s"/>
          <circle class="ai-node" cx="560" cy="290" r="9" style="animation-delay:.2s"/>
          <circle class="ai-node" cx="700" cy="120" r="9" style="animation-delay:.4s"/>
          <circle class="ai-node" cx="700" cy="190" r="9" style="animation-delay:.5s"/>
          <circle class="ai-node" cx="700" cy="260" r="9" style="animation-delay:.6s"/>
          <circle class="ai-node" cx="700" cy="320" r="9" style="animation-delay:.7s"/>
          <circle class="ai-node" cx="840" cy="170" r="9" style="animation-delay:.9s"/>
          <circle class="ai-node" cx="840" cy="270" r="9" style="animation-delay:1s"/>
          <circle class="ai-out"  cx="935" cy="220" r="12" style="animation:ai 1.7s ease-in-out infinite; animation-delay:1.2s"/>
        </g>

        <text class="ai-name" x="700" y="360">AI MODEL</text>
        <text class="ai-sub"  x="700" y="388">path-prediction model</text>
      </g>

      <!-- ===== bidirectional link: AMR cab  <->  AI model ===== -->
      <path class="link up"   d="M1486,588 C 1180,438 980,372 872,326"/>
      <path class="link down" d="M892,346 C 1010,428 1220,506 1474,616"/>
      <polygon points="872,326 912,328 890,362" fill="var(--cyan)"/>
      <polygon points="1474,616 1436,608 1458,584" fill="var(--violet)"/>
      <circle class="flow-dot up" r="9"   style="offset-path:path('M1486,588 C 1180,438 980,372 872,326'); animation-delay:0s"/>
      <circle class="flow-dot up" r="9"   style="offset-path:path('M1486,588 C 1180,438 980,372 872,326'); animation-delay:1.2s"/>
      <circle class="flow-dot down" r="9" style="offset-path:path('M892,346 C 1010,428 1220,506 1474,616'); animation-delay:.6s"/>
      <circle class="flow-dot down" r="9" style="offset-path:path('M892,346 C 1010,428 1220,506 1474,616'); animation-delay:1.8s"/>

      <rect class="scrim" x="1004" y="430" width="286" height="40" rx="8"/>
      <text class="lbl-up" x="1020" y="459">state &#183; telemetry &#8593;</text>
      <rect class="scrim" x="912" y="556" width="330" height="40" rx="8"/>
      <text class="lbl-down" x="928" y="585">&#8595; AI path prediction</text>

      <!-- ===== predicted path ahead of the AMR ===== -->
      <polygon class="pred-cone" points="1500,760 1980,1060 2110,1352 1500,832"/>
      <path class="pred" d="M1520,790 C 1610,868 1690,932 1772,998"/>
      <circle class="pred-dot" r="9" style="offset-path:path('M1520,790 C 1610,868 1690,932 1772,998'); animation-delay:0s"/>
      <circle class="pred-dot" r="9" style="offset-path:path('M1520,790 C 1610,868 1690,932 1772,998'); animation-delay:1.4s"/>
      <rect class="scrim" x="1470" y="874" width="250" height="40" rx="8"/>
      <text class="lbl-pred" x="1486" y="904">path prediction</text>

      <!-- ===== model-validation gate: predicted path dies here ===== -->
      <path class="dead" d="M1772,998 C 1880,1092 1992,1204 2110,1332"/>
      <rect class="scrim" x="1836" y="1300" width="250" height="42" rx="8"/>
      <text class="dead-tag" x="1852" y="1331">&#9888; unusable</text>

      <path d="M1772,998 L1836,1030" stroke="var(--warn)" stroke-width="3" fill="none" opacity=".7"/>
      <polygon points="1772,998 1748,982 1748,1014" fill="var(--warn)"/>
      <polygon points="1772,998 1796,982 1796,1014" fill="var(--warn)"/>

      <g class="gate">
        <rect x="1596" y="1024" width="500" height="222" rx="12"/>
        <text class="g-title"   x="1620" y="1062">MODEL VALIDATION</text>
        <text class="g-item"    x="1620" y="1100">&#183; trustworthy?</text>
        <text class="g-item"    x="1620" y="1134">&#183; valid for THIS AMR?</text>
        <text class="g-item"    x="1620" y="1168">&#183; valid in THIS context?</text>
        <text class="g-verdict" x="1620" y="1210">&#10007; NOT VALIDATED &#8594; discard</text>
      </g>

      <!-- bottom caption -->
      <rect class="scrim" x="0" y="1358" width="2240" height="94"/>
      <text class="cap-bot" x="1120" y="1416">an AI <tspan class="hi">path prediction</tspan> is worthless unless the model is <tspan class="hi">trustworthy</tspan> and <tspan class="hi">valid</tspan> &#8212; for <tspan class="warnw">THIS AMR</tspan>, in <tspan class="warnw">THIS context</tspan></text>
    </svg>
  </div>
</body>
</html>
